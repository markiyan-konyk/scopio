# SCOPIO node parameters, loaded by microscope.launch.py; baked into the image (see ../../../docs/CONFIGURATION.md).

/scopio/camera_node:
  ros__parameters:
    width: 640
    height: 480
    framerate: 30.0          # capture fps (drives exposure/gain budget)
    publish_fps: 15.0        # rate of the compressed image topic

/scopio/stage_node:
  ros__parameters:
    port: ""                 # empty = auto-detect; SANGABOARD_PORT in .env wins
    reconnect_period: 10.0
    publish_rate: 5.0        # Hz, StagePosition
    step_x: 40               # declared but unused by the node
    step_y: 40
    step_z: 40

/scopio/galvo_node:
  ros__parameters:
    resource: ""             # empty = first USB Rigol; GALVO_RESOURCE in .env wins
    init_on_connect: true    # on connect, DC mode + outputs ON, so update(ch,val) moves the galvo
    publish_rate: 5.0        # Hz, AwgStatus (cached state, no polling)
    reconnect_period: 15.0
    timeout_ms: 15000        # long: a large waveform upload takes the AWG seconds

/scopio/temperature_node:
  ros__parameters:
    resource: ""             # empty for USB (transport by kernel ownership); TCLAB_RESOURCE in .env wins
    units: "C"               # forced on connect; "" reads them instead
    publish_rate: 1.0        # Hz, polled: five USB round trips per poll
    reconnect_period: 5.0    # short: opening is quick, and drops need three failures
    timeout_ms: 5000

/scopio/relay_node:
  ros__parameters:
    gpio_pin: 17             # BCM, physical pin 11; not 14, 15 or 23-25 (the Sangaboard's)
    # LASER SAFETY: active-low on this rig, so config.txt needs gpio=17=op,dh or the pulled-low pin means laser ON.
    active_high: false
    reconnect_period: 10.0   # s between attempts to claim the pin

/scopio/calibration_node:
  ros__parameters:
    calibration_file: "calibration.json"   # relative to /data, i.e. ros2_ws/data on the Pi
