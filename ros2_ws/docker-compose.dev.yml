# No-hardware override for a laptop (see README.md): docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  scopio:
    network_mode: bridge
    privileged: false
    ipc: shareable
    restart: "no"
    ports:
      - "8000:8000"          # published FOR the gateway (it shares this netns)
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - CAMERA_URL=

  camera:
    # arm/Pi-only image; parked behind an unused profile so the dev stack
    # neither builds nor starts it.
    profiles: ["pi-hardware-only"]

  gateway:
    network_mode: "service:scopio"
    ipc: "service:scopio"
    restart: "no"
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - SCOPIO_API_KEYS_FILE=/secrets/api_keys.json
      - SCOPIO_GATEWAY_PORT=8000
      - CAMERA_URL=
