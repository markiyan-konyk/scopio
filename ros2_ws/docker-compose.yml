# SCOPIO on the Pi: `docker compose up -d --build` here. Explained in README.md and ../docs/CONFIGURATION.md.
services:
  scopio:
    build:
      context: .
      dockerfile: Dockerfile
    image: scopio-microscope:jazzy
    container_name: scopio
    network_mode: host
    privileged: true
    ipc: host
    restart: unless-stopped
    volumes:
      - ./data:/data                 # runtime state only; the repo is never mounted
      - /run/udev:/run/udev:ro
      - /dev:/dev                    # hotplug: privileged alone snapshots /dev at create time
    environment:
      # From .env; empty = auto-discover by vendor id. An Ethernet TC10 must be named.
      - GALVO_RESOURCE=${GALVO_RESOURCE:-}
      - TCLAB_RESOURCE=${TCLAB_RESOURCE:-}
      - SANGABOARD_PORT=${SANGABOARD_PORT:-}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - CAMERA_URL=http://127.0.0.1:8081   # camera_node bridge mode upstream
      # Named: an unset factory can fall through to `native`, which does not drive a modern Pi's pins.
      - GPIOZERO_PIN_FACTORY=${GPIOZERO_PIN_FACTORY:-lgpio}
    working_dir: /data
    command: ros2 launch scopio_microscope microscope.launch.py
    # Least-privilege alternative to privileged (untested; a listed device that does not exist yet stops the start):
    # devices:
    #   - /dev/dma_heap:/dev/dma_heap
    #   - /dev/vchiq:/dev/vchiq
    #   - /dev/video0:/dev/video0
    #   - /dev/ttyACM0:/dev/ttyACM0   # Sangaboard
    #   - /dev/bus/usb:/dev/bus/usb   # DG1022Z (libusb / pyvisa-py)
    #   - /dev/usbtmc0:/dev/usbtmc0   # TC10 LAB (kernel usbtmc char device)
    # device_cgroup_rules:
    #   - "c 180:* rmw"

  camera:
    build:
      context: ../camera_server
      dockerfile: Dockerfile
    image: scopio-camera:bookworm
    container_name: scopio-camera
    network_mode: host
    privileged: true               # /dev/video*, /dev/dma_heap, /dev/media*
    restart: unless-stopped
    volumes:
      - /run/udev:/run/udev:ro
      - /dev:/dev                  # so a camera that appears later is visible
    environment:
      - CAM_HOST=127.0.0.1         # loopback ONLY -- the gateway is the door
      - CAM_PORT=8081
      - CAM_W=${CAM_W:-640}
      - CAM_H=${CAM_H:-480}

  gateway:
    # Reuses the image scopio builds (a second build: built it twice in parallel); the tag is local only.
    image: scopio-microscope:jazzy
    pull_policy: never
    container_name: scopio-gateway
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - scopio
    volumes:
      - ./secrets:/secrets:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - SCOPIO_API_KEYS_FILE=/secrets/api_keys.json
      - SCOPIO_GATEWAY_PORT=8000
      - CAMERA_URL=http://127.0.0.1:8081
    command: ros2 run scopio_gateway gateway
